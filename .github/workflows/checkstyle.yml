name: Checkstyle

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  checkstyle:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-distribution: [ temurin ]
        java-version: [ 21, 25 ]
      fail-fast: false

    steps:
      - name: "Check out MM Data"
        uses: actions/checkout@v6

      - name: Set up ${{ matrix.java-distribution }} JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.java-distribution }}
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Formatting first: it reports every violation in one run.
      # The ratchet in build.gradle.kts compares against origin/main, which a shallow checkout does not have.
      - name: Fetch main for the formatting ratchet
        run: git fetch --depth=1 origin main

      - name: Formatting (Spotless)
        run: |
          ./gradlew spotlessApply
          if git diff --quiet; then
            echo "Formatting clean."
            exit 0
          fi
          {
            echo "## Formatting violations"
            echo
            echo "Run \`./gradlew spotlessApply\` and commit the result. Every file below is fixed by that one command."
            echo
            echo '```diff'
            git diff | head -c 900000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # -z gives raw paths (git would otherwise quote unusual ones), and the annotation property must
          # have % : , and line breaks percent-encoded or the path is cut short.
          git diff --name-only -z | while IFS= read -r -d '' changedFile; do
            escapedFile=${changedFile//%/%25}
            escapedFile=${escapedFile//$'\r'/%0D}
            escapedFile=${escapedFile//$'\n'/%0A}
            escapedFile=${escapedFile//:/%3A}
            escapedFile=${escapedFile//,/%2C}
            echo "::error file=${escapedFile}::Formatting violation. Run ./gradlew spotlessApply"
          done
          exit 1

      - name: Checkstyle
        run: ./gradlew checkstyleMain

      - name: Upload Test Logs on Failure
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cd-failure-logs
          path: ./build/reports/
