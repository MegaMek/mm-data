# Dates are the canonical span (declared over by ComStar in 3025); intensity was
# lower than the first two Succession Wars but the House borders were in
# near-continuous conflict.

wars:
  - name: Third Succession War
    start: 2866-01-01
    end: 3025-12-31
    parties:
      - factions: [CC, FS]
      - factions: [CC, FWL]
      - factions: [DC, FS]
      - factions: [DC, LA]
      - factions: [FWL, LA]
