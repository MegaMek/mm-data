  # Misc SPA

  - lookupName: unofficial_transport_negotiator
    displayName: Transport Negotiator (Unofficial)
    desc: |-
      Decreases all transport costs by 5%. Multiple characters with this SPA do not stack their benefits.

      Has no benefit to a character without the Admin profession.
    xpCost: 100
    originOnly: false
    weight: 1
    skillPrereqs:
      - Administration: Regular

  - lookupName: unofficial_bargain_hunter
    displayName: Bargain Hunter (Unofficial)
    desc: |-
      Decreases the Target Number for all Appraisal checks by 2.

      This is useful for procurement characters as it increases the chance they will find a bargain (discount) on purchased parts.

      Has limited benefit if the functional appraisal option is not enabled in campaign options.
    xpCost: 100
    originOnly: false
    weight: 1
    skillPrereqs:
      - Appraisal: Regular

