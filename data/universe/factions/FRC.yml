key: FRC
name: Free Capella
# The anti-Confederation exile movement of Mandrinn Tormano Liao, opposed to Chancellor Sun-Tzu
# Liao. Backed from the Federated Commonwealth and folded back into the Confederation after
# Tormano's fall, which is why the span closes in 3070.
yearsActive:
  - start: 3057
    end: 3070
tags:
  - IS
  - MINOR
  - REBEL
# The Blackwind Lancers, Borodin's Vindicators and the Free Republic Revolutionaries all have
# camo art under this folder already.
camos: Capellan Confederation/Free Capella
nameGenerator: CC
ratingLevels:
  - F
  - D
  - C
  - B
  - A
# A Capellan splinter, so equipment availability, formation sizes and ranks all come from the
# Confederation rather than the generic Inner Sphere pool.
fallBackFactions:
  - CC
rankSystem: CCAF
