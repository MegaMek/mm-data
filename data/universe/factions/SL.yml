key: SL
name: Star League
# rankSystem is set explicitly so Faction2.getRankSystem() doesn't fall through to
# fallBackFactions. Without this, SL inherits whichever of LA / FS / CC / FWL / ... is
# loaded first by the registry — observed in MekHQ Force Generator logs as the SL
# rank-authority faction resolving to CCAF (Capellan) for support personnel.
rankSystem: SLDF
sucsCodes:
  - SL
  - SLDF
capital: Terra
yearsActive:
  - start: 2571
    end: 2780
  # Second Star League: First Whitting Conference (November 3058) through the Fourth
  # Whitting Conference dissolution vote on 28 November 3067. Without this span the SL
  # entries in the faction diplomacy data (Operation Bulldog, Second Star League alliance)
  # reference an inactive faction. The Third Star League has its own code (SL3).
  - start: 3058
    end: 3067
# NOTE: TH (Terran Hegemony) is intentionally NOT listed here. TH.fallBackFactions
# already contains SL, so adding TH here would create a SL <-> TH cycle that crashes
# RATGenerator.findModelAvailabilityRecord with StackOverflowError. The bidirectional
# Faction.isLineageCompatible check used by Academy.java still resolves TH <-> SL
# correctly via the existing TH -> SL relationship.
fallBackFactions:
  - LA
  - FS
  - CC
  - FWL
  - DC
  - MOC
  - OA
  - RWR
  - TC
tags:
  - PLAYABLE
  - IS
  - SUPER
  - CONTROLLING
  - GENEROUS
