# ------------------------------------------------------------------------------
# DATA NOTES (for review):
#  - Composition is strongly era-dependent; only the eras above with a
#    `battalionWeights` line have a sourced weight breakdown. Other eras give
#    only "expanded/reinforced regiment" with no per-battalion weights.
#  - 3rd / 6th / 9th / 15th are sparse: destroyed, disbanded or inactive for
#    most of the timeline.
#  - Nickname conflict to verify: sarna.net lists BOTH the 4th and the 8th as
#    "Jade Dragon". The 9th reusing the 2nd's "Steel Dragon" is expected (it
#    was formed to replace the 2nd).
#  - 2nd SoL 3025 is given on the wiki in companies (3 light / 6 heavy /
#    3 assault) - converted here to 4 battalions [Light, Heavy, Heavy, Assault].
# ------------------------------------------------------------------------------

