# --- Specific units of this command (DRAFT pilot data) ------------------------
# Pilot extraction for the Sword of Light regiments. Sources: sarna.net unit
# pages, cross-checked against the canonical Field Manual battalion compositions
# (the 1st/2nd/5th weights below match both). Treat as a DRAFT pending review:
# sarna.net is a community wiki and many eras give no weight breakdown.
#
# Proposed schema (era-aware): each unit carries a `history` list; each entry
# applies from its `era` year until the next entry's year, matching how the
# force generator already gates rules with ifDateBetween. `battalionWeights` is
# the per-battalion weight class of the Mek regiment and is omitted where the
# source records none. All Sword of Light regiments are four-battalion
# ("expanded" / reinforced) regiments.
#
# Kept commented until the schema is agreed and the loader / force generator is
# extended to consume it; every line is "# "-prefixed so uncommenting yields
# valid YAML.
#
# units:
#   - name: First Sword of Light
#     nickname: Ivory Dragon
