description: '<p>The community project that documents unit paint schemes and insignia, from which a large part
  of this repository''s camouflage art derives. Schemes marked as canonized by CSO are that
  project''s own designation and are not drawn from a published product, which is why this entry
  is not marked canon.</p>'
