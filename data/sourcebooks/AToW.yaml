description: '<p><strong>A TIME OF WAR</strong></p><p>It is the 31st century. Mankind has spread to the stars and spawned titanic stellar empires, each controlling hundreds of worlds across a thousand light years and beyond. Yet the sins of man have followed him from the cradle of humanity.</p><p>Political machinations of feudal lords plunge whole sectors into war; unscrupulous merchant starship captains smuggle weapons to their own faction''s enemies; greedy military commanders demand tribute from worlds they''re protecting; animalistic pirate kings harvest high technologies and human slaves in lightning raids; betrayals from oath-bound allies leave honorable soldiers growing cold on forgotten worlds; death at the tip of knife from a concubine turned assassin to avenge a world and love lost: it is a time of war.</p><p>What empire will you swear allegiance to: a warrior merchant of House Steiner; the honorbound samurai of House Kurita; the vat-bred warriors of the Clans; a mercenary that fights only for the highest bidder?</p><p>Choose your life in the universe: a MechWarrior piloting the thirty-foot-tall BattleMechs that turn the tide of any battle; a spy deep behind enemy lines discovering critical secrets; a merchant carrying critical supplies; a scientist unleashing the latest cutting edge technologies?</p><p>How will YOU become a legend?</p>'
