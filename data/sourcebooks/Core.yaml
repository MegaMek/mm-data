description: '<p><strong>THE GAME OF ARMORED COMBAT</strong></p><p>A thousand years in the future, humanity has spread to the stars and spawned titanic interstellar empires. Raids, counter-raids and even all-out invasions are nearly constant. You are the MechWarrior elite, piloting a multi-ton, towering avatar of war: the BattleMech. Your decisions will raise dynasties or topple worlds.</p><p>Four decades in the making, the BattleTech Core Rulebook is the culmination of the shared passion, experience and expertise of millions of fans all around the world. Meticulously rebuilt into a modern presentation, it is the indispensable rules reference for BattleTech games. The Core Rulebook also adds an expansive Missions section allowing for rapid force building, mission selection, and battlefield engagement. This book is fully compatible with all previously released BattleTech maps and models, as well as nearly every previously published record sheet.</p><p>Whether you''ve been here the whole time, you’re coming back to the game for the first time in decades, or picking it up for the very first time, fabulous, narrative-driven games await you on the battlefields of the Inner Sphere!</p>'
